[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kakaotalk-mcp"
version = "0.4.0"
description = "KakaoTalk MCP with Windows automation and experimental macOS Accessibility board adapter"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "kronenz"}]
keywords = ["mcp", "kakaotalk", "automation", "win32", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "mcp[cli]>=1.3.0,<2",
    "pywin32>=306; sys_platform == 'win32'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/YGJangontact/kakaotalk-mcp"
Repository = "https://github.com/YGJangontact/kakaotalk-mcp"
Issues = "https://github.com/YGJangontact/kakaotalk-mcp/issues"

[project.scripts]
kakaotalk-mcp = "kakao_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kakao_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
